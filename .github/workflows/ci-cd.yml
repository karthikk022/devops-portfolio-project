test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      working-directory: ./src
      run: npm ci

    - name: Run linter
      working-directory: ./src
      run: npm run lint

    - name: Run tests
      working-directory: ./src
      run: npm test

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: src/coverage/
